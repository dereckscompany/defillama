url: https://dereckscompany.github.io/defillama/

template:
  bootstrap: 5

navbar:
  structure:
    left: [reference]
    right: [search, github]
  components:
    github:
      icon: fa-github
      href: https://github.com/dereckscompany/defillama
      aria-label: GitHub repository

reference:
  - title: Stablecoins
    desc: Stablecoin circulating supply, history, and market cap per chain.
    contents:
      - DefiLlamaStablecoins
  - title: Protocol and chain TVL
    desc: DeFi protocol and chain total value locked, current and historical.
    contents:
      - DefiLlamaProtocols
  - title: DEX volumes and fees
    desc: The dimension-adapter clients for trading volumes and fees/revenue.
    contents:
      - DefiLlamaVolumes
      - DefiLlamaFees
  - title: Base class and configuration
    desc: The shared transport base, URL getters, and data-type vocabularies.
    contents:
      - DefiLlamaBase
      - defillama_base_url
      - defillama_stablecoins_url
      - DEX_DATA_TYPES
      - FEES_DATA_TYPES
  - title: Conditions and shapes
    desc: The typed condition family and the documented return shapes.
    contents:
      - defillama_conditions
      - defillama_shapes
